services:
  sfia-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sfia-skill-mapping
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=5000
    deploy:
      resources:
        limits:
          memory: 4G
